<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="iconBgWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cyanGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- App Icon Badge -->
  <rect width="80" height="80" rx="20" fill="url(#iconBgWhite)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- GPS Telematics Waves -->
  <path d="M22 46 A 22 22 0 0 1 58 46" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="22" cy="46" r="2.5" fill="#38BDF8"/>
  <circle cx="40" cy="24" r="3" fill="#06B6D4"/>
  <circle cx="58" cy="46" r="2.5" fill="#38BDF8"/>
  
  <path d="M28 46 A 14 14 0 0 1 52 46" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95"/>
  <circle cx="40" cy="32" r="2" fill="#FFFFFF"/>

  <!-- Futuristic Fleet Truck -->
  <path d="M20 54 L38 54 L45 44 L56 44 L60 51 L60 58 L20 58 Z" fill="url(#cyanGradWhite)"/>
  <path d="M46 46 L53 46 L56 51 L46 51 Z" fill="#0F172A" opacity="0.7"/>
  
  <!-- Speed Lines / Circuit Nodes -->
  <line x1="14" y1="50" x2="26" y2="50" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="12" y1="54" x2="22" y2="54" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Wheels -->
  <circle cx="30" cy="58" r="4.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="52" cy="58" r="4.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <circle cx="30" cy="58" r="1.5" fill="#38BDF8"/>
  <circle cx="52" cy="58" r="1.5" fill="#38BDF8"/>

  <!-- Brand Typography -->
  <text x="96" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-1">H2H</text>

  <rect x="172" y="24" width="6" height="24" rx="3" fill="#38BDF8"/>

  <text x="98" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="16" font-weight="800" fill="#38BDF8" letter-spacing="4.5">FLEET</text>

  <!-- Tagline badge -->
  <rect x="172" y="52" width="98" height="18" rx="9" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="178" y="64.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="9" font-weight="700" fill="#7DD3FC" letter-spacing="0.5">SMART TELEMATICS</text>
</svg>
